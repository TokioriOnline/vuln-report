name: 週次脆弱性レポート自動生成

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 既存データをgh-pagesから取得
        run: |
          git fetch origin gh-pages || true
          mkdir -p docs
          git checkout origin/gh-pages \
            -- docs/data.json || true
          git checkout origin/gh-pages \
            -- docs/vuln_history.json || true
          echo "既存データ取得完了"
          ls -la docs/ || true

      - name: Python環境を設定
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 脆弱性情報を収集してHTML生成
        run: python collect_vulns.py

      - name: GitHub Pagesにデプロイ
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
